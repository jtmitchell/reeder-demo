[project]
name = "reeder"
dynamic = ["version"]
description = "A simple demonstration of using REST API to save RSS articles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django~=4.2",
    "whitenoise>=6.7.0",
    "django-allauth[mfa]>=64.1.0",
    "django-htmx>=1.19.0",
    "django-redis>=5.4.0",
    "granian>=1.6.0",
    "psycopg2-binary>=2.9.9",
    "django-ninja>=1.3.0",
]
[project.scripts]
"manage.py" = "reeder.manage:django_manage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "config/version.py"

[tool.uv]
package = false
dev-dependencies = [
    "django-debug-toolbar>=4.4.6",
    "bandit>=1.7.9",
    "pre-commit>=3.8.0",
    "bump2version>=1.0.1",
    "pytest>=8.3.2",
    "pytest-django>=4.8.0",
    "ruff==0.6.2",
    "ruff-lsp>=0.0.55",
    "pyupgrade>=3.17.0",
    "django-upgrade>=1.20.0",
    "debugpy>=1.8.5",
]
[tool.bandit]
# Configuration for bandit security checking tool
exclude_dirs = ["src/test/"]
